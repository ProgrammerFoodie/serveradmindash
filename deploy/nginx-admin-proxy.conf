# Shared proxy settings for the admin dashboard (installed as /etc/nginx/snippets/admin-proxy.conf).
# It lives on the root disk on purpose: nginx must still start if /mnt/Extra20 is not mounted yet.
proxy_pass http://127.0.0.1:9100;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Overwritten, never passed through: the app uses these for login throttling and its audit trail.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_redirect off;
proxy_connect_timeout 3s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_hide_header Server;
